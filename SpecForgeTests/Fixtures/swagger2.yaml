swagger: "2.0"
info:
  title: Tiny Pets API
  version: "2.1.0"
host: api.example.com
basePath: /v2
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      parameters:
        - name: limit
          in: query
          type: integer
          format: int32
          required: false
          description: Maximum number of pets.
      responses:
        "200":
          description: A list of pets.
          schema:
            type: array
            items:
              $ref: "#/definitions/Pet"
    post:
      operationId: createPet
      summary: Create a pet
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Pet"
      responses:
        "201":
          description: The created pet.
          schema:
            $ref: "#/definitions/Pet"
  /pets/{petId}:
    get:
      operationId: getPet
      summary: Get a pet
      parameters:
        - name: petId
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A pet.
          schema:
            $ref: "#/definitions/Pet"
definitions:
  Pet:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
      tag:
        type: string
      owner:
        $ref: "#/definitions/Owner"
  Owner:
    type: object
    required:
      - id
    properties:
      id:
        type: string
      displayName:
        type: string
