<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a0e">
  <title>Page not found — SpecForge</title>
  <link rel="icon" type="image/png" href="/specforge/assets/favicon.png">
  <link rel="stylesheet" href="/specforge/styles.css">
  <style>
    .not-found { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 20px; }
    .not-found-inner { max-width: 480px; }
    .not-found-code { font-family: var(--font-mono); color: var(--accent); font-size: 13px; letter-spacing: .16em; }
    .not-found h1 { margin: 14px 0 16px; font-size: clamp(2.4rem, 6vw, 4rem); }
    .not-found p { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found-inner">
      <div class="brand-mark" style="margin: 0 auto 26px; width: 48px; height: 48px;">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#ff6b3d"/><path d="M18.4 5.8 9.7 17.5h5.1l-1.2 8.7 8.7-11.7h-5.1l1.2-8.7Z" fill="#fff"/></svg>
      </div>
      <div class="not-found-code">404 · NOT FOUND</div>
      <h1>This page slipped out of the spec.</h1>
      <p>The link doesn’t exist, but the Swift client generator is still one click away.</p>
      <a class="button button-primary button-large" href="/specforge/">Back to SpecForge</a>
    </div>
  </main>
</body>
</html>
