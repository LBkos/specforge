name: SpecForge
options:
  bundleIdPrefix: com.specforge
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "27.0"

packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: 6.2.2

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES

targets:
  SpecForge:
    type: application
    platform: macOS
    sources:
      - path: SpecForge
        excludes:
          - "Info.plist"
    info:
      path: SpecForge/Info.plist
      properties:
        CFBundleName: SpecForge
        CFBundleDisplayName: SpecForge
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Copyright © 2026 SpecForge."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - package: Yams
        product: Yams
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.specforge.app
        PRODUCT_NAME: SpecForge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 SpecForge."
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  SpecForgeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SpecForgeTests
    dependencies:
      - target: SpecForge
      - package: Yams
        product: Yams
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.specforge.app.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  SpecForge:
    build:
      targets:
        SpecForge: all
        SpecForgeTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SpecForgeTests
    archive:
      config: Release
